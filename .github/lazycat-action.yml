version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: openbudgeteer
build:
  toolchains: []
  run_buildscript: false
images:
  - id: openbudgeteer
    target: service
    service: openbudgeteer
    source: axelander/openbudgeteer
    channel: stable
    sort: semver
    tag_regex: ^v?[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
  - id: mariadb
    target: service
    service: mariadb
    source: library/mariadb
    channel: custom
    sort: semver
    tag_regex: ^11[.]8[.][0-9]+$
    version_regex: ^(?P<version>11[.]8[.][0-9]+)$
    version_template: "{version}"
    delivery:
      mode: mirror
      require_digest_match: true
  - id: redis
    target: service
    service: redis
    source: library/redis
    channel: custom
    sort: semver
    tag_regex: ^7[.]2[.][0-9]+$
    version_regex: ^(?P<version>7[.]2[.][0-9]+)$
    version_template: "{version}"
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: openbudgeteer
    skip_if_version_exists: true
