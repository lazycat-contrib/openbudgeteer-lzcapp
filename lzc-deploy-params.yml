params:
  - id: ob_admin_user_9sdg
    type: string
    name: "登录用户名"
    description: "OpenBudgeteer 登录用户名（单用户模式）"
    default_value: "admin"
    optional: false
  - id: ob_admin_pass_9sdg
    type: secret
    name: "登录密码"
    description: "OpenBudgeteer 登录密码（已预置随机值，可在部署参数中查看）"
    default_value: "rQ8wTv4kXm2pJd6n"
    optional: false
  - id: ob_db_pass_9sdg
    type: secret
    name: "数据库密码"
    description: "MariaDB 数据库密码（已预置随机值，应用自动使用）"
    default_value: "hT5eNy8cWq3rZb1s"
    optional: false
  - id: ob_db_root_9sdg
    type: secret
    name: "数据库 Root 密码"
    description: "MariaDB root 密码，仅首次建库使用（已预置随机值，应用自动使用）"
    default_value: "kW9aGv2xFt7qMn5y"
    optional: false

